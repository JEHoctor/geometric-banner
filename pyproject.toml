[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project]
name = "geometric-banner"
version = "0.0.1"
authors = [
    {name = "James Hoctor", email = "jehoctor@protonmail.com"}
]
description = "Make geometric banner images, e.g. for a LinkedIn profile banner."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.7.0",      # first release to require Python 3.7+ (modern packaging)
    "numpy>=1.23.2",        # first Python 3.11 wheels; numpy.typing (1.20) and default_rng (1.17)
    "rich>=10.11.0",        # matches typer's own floor
    "scikit-learn>=1.1.3",  # first Python 3.11 wheels
    "typer>=0.19.0",        # typing.Literal choices (fastapi/typer#429)
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.scripts]
geometric-banner = "geometric_banner.main:app"

[project.urls]
"Homepage" = "https://github.com/JEHoctor/geometric-banner"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12", "ty>=0.0.29"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # missing docstrings: not required on every public symbol in this small package
    "COM812", # trailing commas: handled by the formatter; ruff recommends disabling
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/geometric_banner/main.py" = ["PLR0913"]  # a typer command is a function with many arguments
"tests/**" = [
    "S101",    # assert is the point of a test
    "PLR2004", # literal expected values are fine in tests
    "INP001",  # tests/ is intentionally not a package
    "D",       # docstrings on tests add nothing
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv --cov=geometric_banner --cov-report=term-missing"

[tool.ty.environment]
python-version = "3.11"
