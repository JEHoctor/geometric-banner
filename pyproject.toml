[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-cover-image"
version = "0.0.1"
authors = [
    {name = "James Hoctor", email = "jehoctor@protonmail.com"}
]
description = "Make geometric banner images for LinkedIn."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "CairoSVG",
    "typer",
    "rich",
    "matplotlib",
    "numpy",
    "scikit-learn",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.scripts]
cover-image = "cover_image.main:app"

[project.urls]
"Homepage" = "https://github.com/JEHoctor/LinkedIn-Cover-Image"

[project.optional-dependencies]
dev = ["pytest", "ruff", "ty", "jupyter", "seaborn", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/cover_image"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv"

[tool.ty]
python-version = "3.11"
